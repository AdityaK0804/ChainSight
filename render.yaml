services:
  - type: web
    name: chainsight
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: gunicorn chainsight.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chainsight-db
          property: connectionString

databases:
  - name: chainsight-db
    plan: free
    databaseName: chainsight
    user: chainsight
